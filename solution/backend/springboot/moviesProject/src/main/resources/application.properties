spring.application.name=moviesProject

server.port=8080
# DataSource settings: PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/DBTWEB
spring.datasource.username=postgres
spring.datasource.password=admin123

# Specify the JDBC driver for PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate properties
# You can configure additional Hibernate properties here if needed
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=update

# Other configurations if required
spring.jpa.show-sql=true

# Disable Hibernate warning for PageImpl serialization
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# Fixes Spring Boot 3.x issues
spring.mvc.pathmatching.strategy=ant_path_matcher 

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Basic debugging
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.tweb=TRACE

# Show binding details
logging.level.org.springframework.web.bind.annotation=TRACE