<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cerca Film</title>
    <link rel="stylesheet" href="../css/stylesMovie.css">
</head>
<body>
    <div class="container">
    <h1>Cerca Film</h1>
    <div class="search-form">
        <select id="search-type">
            <option value="TITLE">Title</option>
            <option value="YEAR">Year</option>
            <option value="GENRE">Genre</option>
        </select>

        <!-- Campo input testuale -->
        <input type="text" id="search-input" placeholder="Inserisci titolo o anno...">

        <!-- Campo select dei generi, inizialmente nascosto -->
        <select id="search-genre" style="display: none;"></select>

        <select id="page-size">
            <option value="10">10 per pagina</option>
            <option value="25">25 per pagina</option>
            <option value="50">50 per pagina</option>
        </select>

        <button onclick="searchMovies(0)">Cerca</button>
    </div>
    <div id="results"></div>
    <div class="pagination" id="pagination"></div>
    </div>

    <script src="../loader/loader.js"></script> <!--it needs to be placed before the js of the page-->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/scriptMovie.js"></script>

</body>
</html>
