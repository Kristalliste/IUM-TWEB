<!-- chat-test.html -->
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Chat Film</title>
</head>
<body>
<h2><span id="roomName">Chat</span></h2>
<div id="chatBox" style="border:1px solid black; height:200px; overflow:auto;"></div>
<input id="chatInput" type="text" placeholder="Scrivi un messaggio...">
<button id="sendBtn">Invia</button>

<!-- Import the socket.io library for real-time communication -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>

    // Ask for the name BEFORE connecting
    const user = prompt("Inserisci il tuo nome:")?.trim();

    // If the user does not enter anything, assign a default name
    const username = user.length > 0 ? user : "Anonimo";

    const room = prompt("Inserisci il nome della stanza:")?.trim() || "Generale";
    const socket = io("http://localhost:3001"); // connessione al server

    // When the socket connection is established
    socket.on("connect", () => {
        // Send 'joinRoom' event to server with room and username
        socket.emit("joinRoom", { room, user: username });
        // Print connection confirmation to console
        console.log(`🔗 Connesso alla stanza ${room} come ${username}`);
    });

    // When you click the "Invia" button
    document.getElementById("sendBtn").onclick = () => {
        // Take the input value and clean it
        const msg = document.getElementById("chatInput").value.trim();
        // If the message is empty, do nothing
        if (msg.length === 0) return;

        // Send 'chatMessage' event with room, user and message
        socket.emit("chatMessage", {
            room,
            user: username,
            message: msg
        });
        // Cleans input after sending
        document.getElementById("chatInput").value = "";
    };

    // Listener for the Enter key!
    document.getElementById("chatInput").addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
            document.getElementById("sendBtn").click(); // Simulate clicking "Invia"
        }
    });

    // Listen to incoming messages from the server
    socket.on("message", (data) => {
        const chatBox = document.getElementById("chatBox");     // Select the message container
        const div = document.createElement("div");              // Create a new div for the message

        // Insert text into div: [date] username:message
        div.innerText = `[${data.time.slice(11, 19)}] ${data.user}: ${data.message}`;
        chatBox.appendChild(div);                   // Adds the message to the container
        chatBox.scrollTop = chatBox.scrollHeight;   // Scroll down to show the latest message
    });
</script>
</body>
</html>
