<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyMDb - Il tuo database di film</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">MyMDb</div>
            <nav class="main-nav">
                <ul>
                    <li class="dropdown">
                        <a href="#" id="genres-link">Generi <i class="fas fa-caret-down"></i></a>
                        <div id="genres-dropdown" class="dropdown-content">
                            <!-- Populated by JS -->
                        </div>
                    </li>
                    <li><a href="#" id="top-rated-link">Film Top Rated</a></li>
                    <li><a href="#" id="advanced-search-link">Ricerca Avanzata</a></li>
                </ul>
            </nav>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Cerca film...">
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <h2 id="main-title">Film più recenti</h2>
            <div id="movie-grid" class="movie-grid">
                <!-- Le schede dei film verranno inserite qui dal JS -->
            </div>
            <div id="pagination-container" class="pagination-container">
                <!-- I controlli di paginazione verranno inseriti qui -->
            </div>
        </div>
    </main>

    <div id="movie-detail-view" class="container">
        <!-- I dettagli del film verranno inseriti qui dal JS -->
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2024 MyMDb. Realizzato con passione.</p>
        </div>
    </footer>

    <script type="module" src="main.js"></script>
</body>
</html>
