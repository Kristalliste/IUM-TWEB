<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilmTWEB - Il tuo database di film</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Bootstrap Icons CSS for Oscar Awards -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">FilmTWEB</div>
            <nav class="main-nav">
                <ul>
                    <li class="dropdown">
                        <a href="#" id="genres-link">Generi <i class="fas fa-caret-down"></i></a>
                        <div id="genres-dropdown" class="dropdown-content">
                            <!-- Populated by JS -->
                        </div>
                    </li>
                    <li><a href="#" id="top-rated-link">Film Top Rated</a></li>
                    <li><a href="#" id="advanced-search-link">Ricerca Avanzata</a></li>
                </ul>
            </nav>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Cerca film...">
            </div>
            <button id="toggle-chat-btn" class="chat-toggle-btn">
                💬 Chat
            </button>

        </div>
    </header>

    <main>
        <div class="container">
            <h2 id="main-title">Film più recenti</h2>
            <div id="movie-grid" class="movie-grid">
                <!-- Movie cards will be inserted here by JS -->
            </div>
            <div id="pagination-container" class="pagination-container">
                <!-- Pagination controls will be inserted here -->
            </div>
        </div>
    </main>

    <div id="movie-detail-view" class="container">
        <!-- Film details will be inserted here -->
    </div>

    <div id="floating-chat" class="floating-chat hidden">
        <div class="chat-header">
            <span>Chat Generale</span>
            <button id="close-chat-btn">×</button>
        </div>
        <div class="chat-body" id="floating-chat-body">
            <!-- Messaggi verranno inseriti qui -->
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2024 FilmTWEB. </p>
        </div>
    </footer>

    <!-- Adding film modal (pop-up) and reference to dedicated view -->
    <div id="movieModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div class="modal-header">
                <img id="detailPoster" src="" alt="Movie Poster" class="modal-poster" />

                <div class="movie-details">
                    <h2 id="detailTitle"></h2>
                    <div class="detail-rating">
                        <span id="detailYear"></span>
                        <i class="fas fa-clock"></i>
                        <span id="detailMinute"></span>
                        <i class="fas fa-star icon-star"></i>
                        <span id="detailRating"></span>
                        <span id="detailOscarIcon" class="bi bi-award" title="Nominated to the Oscar Awards"></span>
                    </div>

                    <p id="detailDescription"></p>

                    <div style="margin-top: 1cm; text-align: center;">
                        <a id="detailLink" href="#" class="details-link">
                            <i class="fas fa-info-circle"></i> View Full Details and Reviews
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/main.js" type="module"></script>
    <script src="js/modalHandler.js" type="module"></script>

</body>
</html>
