<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilmTWEB - Ricerca Avanzata Film</title>
    <link rel="stylesheet" href="styleSearch.css"> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
</head>
<body>
<header>
    <div class="container">
<!--        <div class="logo">FilmTWEB</div>-->
        <a href="mainView.html?view=recent" class="logo" id="logo">FilmTWEB</a>
        <nav class="main-nav">
            <ul>
                <li><a href="mainView.html?view=top-rated" id="top-rated-link">Film Top Rated</a></li>
                <li><a href="#" id="advanced-search-link" class="active">Ricerca Avanzata</a></li>
            </ul>
        </nav>
    </div>
</header>

<main>
    <div class="container">
        <h2 id="search-page-title">Ricerca Avanzata</h2>
        <div class="search-controls-container">
            <div class="search-form">
                <div class="form-group">
                    <label for="search-type">Tipo di ricerca:</label>
                    <select id="search-type">
                        <option value="TITLE">Titolo</option>
                        <option value="YEAR">Anno</option>
                        <option value="GENRE">Genere</option>
                        <option value="LANGUAGE">Lingua</option>
                        <option value="ACTOR">Attore</option>
                        <option value="REGIST">Regist</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Cerca:</label>
                    <input type="text" id="search-input" placeholder="Inserisci valore di ricerca...">
                    <select id="search-genre" style="display: none;" ></select>
                </div>

                <div class="form-group">
                    <label for="page-size">Risultati per pagina:</label>
                    <select id="page-size">
                        <option value="10">10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                    </select>
                </div>

                <button class="search-button" id="search-button">Cerca</button>
            </div>
        </div>

        <div id="movie-grid" class="movie-grid">
        </div>
        <div id="pagination-container" class="pagination-container">
        </div>
        <div id="movie-detail-view" class="container">
            <!-- Film details will be inserted here -->
        </div>
    </div>
</main>

<footer>
    <div class="container">
        <p>&copy; 2024 FilmTWEB. Tutti i diritti riservati.</p>
    </div>
</footer>

<!-- Adding film modal (pop-up) and reference to dedicated view -->
<div id="movieModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <div class="modal-header">
            <img id="detailPoster" src="" alt="Movie Poster" class="modal-poster" />

            <div class="movie-details">
                <h2 id="detailTitle"></h2>
                <div class="detail-rating">
                    <span id="detailYear"></span>
                    <i class="fas fa-clock"></i>
                    <span id="detailMinute"></span>
                    <i class="fas fa-star icon-star"></i>
                    <span id="detailRating"></span>
                    <span id="detailOscarIcon" class="bi bi-award" title="Nominated to the Oscar Awards"></span>
                </div>

                <p id="detailDescription"></p>

                <div style="margin-top: 1cm; text-align: center;">
                    <a id="detailLink" href="#" class="details-link">
                        <i class="fas fa-info-circle"></i> View Full Details and Reviews
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="loader/loader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="js/searchMain.js" type="module"></script>
<!--<script src="js/modalHandler.js" type="module"></script> -->
</body>
</html>
