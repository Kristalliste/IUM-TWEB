<button id="back-button" class="back-button">
        <i class="fas fa-arrow-left"></i> Return to Movie List
    </button>
    <div id="MovieDetailsPage" class="detail-grid">
        <div class="detail-poster-chat-container">
            <div class="detail-poster">
                <img id="detail-view-poster" src="" alt="Movie poster" />
            </div>

            <div class="chat-section">
                <h2>Chat Live</h2>
                <div id="chat-wrapper">
                </div>
            </div>
        </div>

        <div class="detail-info">
            <h1 id="detail-view-title">
                <span id="detail-view-year" class="year"></span>
            </h1>

            <div class="detail-meta">
                <div class="detail-rating">
                    <i class="bi bi-star-fill"></i>
                    <span id="detail-view-rating"></span>
                </div>
                <div class="detail-runtime">
                    <i class="bi bi-clock"></i>
                    <span id="detail-view-minute"></span>
                </div>
                <span
                        id="detail-view-oscar-icon"
                        class="bi bi-award"
                        title="Nominated to the Oscar Awards"
                        style="display: none"
                ></span>
            </div>

            <p id="detail-view-description" class="description"></p>

            <div class="detail-list-container">
                <div class="languages-section">
                    <h3 class="detail-section-header">Languages</h3>
                    <ul id="detail-view-languages-list" class="languages-list">
                    </ul>
                </div>

                <div class="genres-section">
                    <h3 class="detail-section-header">Genres</h3>
                    <ul id="detail-view-genres-list" class="genres-list">
                    </ul>
                </div>

                <div class="actors-section">
                    <h3 class="detail-section-header">Cast</h3>
                    <ul id="detail-view-actors-list" class="actors-list">
                    </ul>
                </div>
            </div>
        </div>

        <div class="reviews-section">
            <h3>Reviews</h3>
            <div id="reviews-list" class="reviews-list">
            </div>
        </div>
    </div>
